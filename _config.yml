timezone: America/New_York
permalink: /posts/:year-:month-:day-:title.html
# Inline comments and likes: enable Discussions, install Giscus for this repo,
# then copy the Announcements category ID from https://giscus.app.
giscus_category_id: ""
exclude:
  - BLOG_PUBLISHING.md

# Every post inherits the same reader controls.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
