timezone: America/New_York
permalink: /posts/:year-:month-:day-:title.html
# Public browser configuration; never use a secret or service-role key.
supabase_url: ""
supabase_publishable_key: ""
exclude:
  - BLOG_PUBLISHING.md
  - supabase
  - tests

# Every post inherits the same reader controls.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
